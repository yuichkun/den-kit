name: Release

# Runs on the push to main that merging a pull request produces, and continues only when that pull request is a
# reviewed release (release/vX.Y.Z from this repository). Running on the push rather than the pull request event keeps
# the release environment, which only main may use, away from workflow code in unmerged pull requests.
on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    if: github.repository == 'yuichkun/den-kit'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      release: ${{ steps.pr.outputs.release }}
      number: ${{ steps.pr.outputs.number }}
      branch: ${{ steps.pr.outputs.branch }}
      reviewed: ${{ steps.pr.outputs.reviewed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Find the release pull request merged by this push
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: node scripts/release-pr.ts
      - name: Verify the reviewed release and version
        if: steps.pr.outputs.release == 'true'
        env:
          SHA: ${{ github.sha }}
          REVIEWED: ${{ steps.pr.outputs.reviewed }}
          BRANCH: ${{ steps.pr.outputs.branch }}
        run: node scripts/release-check.ts

  verify:
    needs: validate
    if: needs.validate.outputs.release == 'true'
    # Every existing check, plus unsigned packaging, against the exact merge commit with read-only permissions.
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ github.sha }}

  build:
    needs: [validate, verify]
    if: needs.validate.outputs.release == 'true'
    runs-on: macos-15
    timeout-minutes: 60
    # Signing, notarization and operator secrets live only in this environment. This job cannot write to the repository.
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
          # No dependency cache in the signing job.
      # vp comes from the lockfile like every other dependency, not from an outside install script.
      - run: npm ci
      - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Write the App Store Connect API key for notarization
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          if [ -n "$APPLE_API_KEY_P8" ]; then
            key="$RUNNER_TEMP/AuthKey.p8"
            printf '%s\n' "$APPLE_API_KEY_P8" > "$key"
            chmod 600 "$key"
            echo "APPLE_API_KEY=$key" >> "$GITHUB_ENV"
          fi
      - name: Build, sign and notarize for Apple silicon and Intel
        env:
          BROWSERPOD_API_KEY: ${{ secrets.BROWSERPOD_API_KEY }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          vp run desktop:build
          vp exec electron-builder --config electron-builder.yml --mac --publish never -c.forceCodeSigning=true
      - name: Check signing, notarization, both architectures and the update feed
        run: vp run desktop:check-artifacts release --notarized
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-release-${{ github.sha }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.blockmap
            release/latest-mac.yml
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [validate, build]
    if: needs.validate.outputs.release == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Publish one release at a time without canceling an active one. GitHub keeps only one pending job per
    # concurrency group, so merge release pull requests one at a time.
    concurrency:
      group: release-publish
      cancel-in-progress: false
    # The only job that can write: it tags the checked commit and publishes the checked packages.
    permissions:
      contents: write
      pull-requests: read
    env:
      SHA: ${{ github.sha }}
      REVIEWED: ${{ needs.validate.outputs.reviewed }}
      BRANCH: ${{ needs.validate.outputs.branch }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - name: Recheck source and remote tags immediately before publication
        id: release
        run: node scripts/release-check.ts
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-release-${{ github.sha }}
          path: release-assets
      - name: Tag the checked commit
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          if [ -z "$(git ls-remote --tags origin "refs/tags/v$VERSION")" ]; then
            git tag "v$VERSION" "$SHA"
            git push origin "refs/tags/v$VERSION"
          fi
      - name: Publish the GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.release.outputs.version }}
          PR: ${{ needs.validate.outputs.number }}
        run: node scripts/release-publish.ts release-assets
