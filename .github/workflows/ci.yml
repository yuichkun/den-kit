name: CI
on:
  push:
  pull_request:
  # The Release workflow reruns every check on the exact merge commit it is about to publish.
  workflow_call:
    inputs:
      ref:
        description: Exact commit to verify for a release
        type: string
        required: true
permissions:
  contents: read
jobs:
  verify:
    # Playwright 1.60.0 cannot install Chromium dependencies on Ubuntu 26.04.
    # Keep this pinned until Playwright supports the new image and CI passes there.
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - run: vp check
      - run: vp exec playwright install --with-deps chromium
      - run: vp run build
      - run: vp run test

  # Package both Mac architectures without signing, secrets or publication, so packaging problems show up
  # in the pull request instead of in a release.
  desktop-package:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}
      - uses: voidzero-dev/setup-vp@68f39c78aaf39be468cabd2afb09c162574c84af # v1.21.2
        with:
          node-version-file: .node-version
          cache: true
          run-install: false
      - run: vp install --frozen-lockfile
      - name: Build unsigned packages for Apple silicon and Intel
        env:
          # A placeholder: this build is never distributed and must not receive the operator's key.
          BROWSERPOD_API_KEY: ci-placeholder-not-a-browserpod-key
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: |
          vp run desktop:build
          vp exec electron-builder --config electron-builder.yml --mac --publish never -c.mac.identity=null
      - name: Check both architectures, the update feed and the bundled Codex CLI
        run: vp run desktop:check-artifacts release
