name: Chromatic
# Publishes the Storybook of every push to Chromatic, which takes a snapshot of each story in each base theme.
# A pull request gets a UI Review there: each changed story beside the base branch's, to comment on and
# approve. Chromatic reports it on the pull request as the UI Review and UI Tests checks.
on: push
permissions:
  contents: read
jobs:
  storybook:
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Chromatic reads the git history to find the build each snapshot is compared with.
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: npm
      # vp comes from the lockfile like every other dependency, not from an outside install script.
      - run: npm ci
      - run: echo "$GITHUB_WORKSPACE/node_modules/.bin" >> "$GITHUB_PATH"
      - run: vp run storybook:build
      - uses: chromaui/action@5bcadb5104b09e360e210c54f95a7437c2d82bab # v18.13.3
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          storybookBuildDir: dist/storybook
