appId: com.escentier.den-kit
productName: den-kit
executableName: den-kit
artifactName: den-kit-${version}-${arch}.${ext}
directories:
  app: .desktop-build/app
  output: release
files:
  - '**/*'
  - '!**/*.map'
  # Main/preload and the renderer are fully bundled. No repository dependencies belong in app.asar.
  - '!node_modules/**/*'
extraResources:
  - from: .desktop-build/resources
    to: .
asar: true
npmRebuild: false
mac:
  icon: build/icon.icns
  target: dir
  category: public.app-category.music
  identity: null
  extendInfo:
    CFBundleName: den-kit
    CFBundleDisplayName: den-kit
    NSMicrophoneUsageDescription: den-kit uses your microphone for audio input and voice input when you choose it.
    NSAudioCaptureUsageDescription: den-kit uses audio input when you choose it.
