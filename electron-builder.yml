appId: com.escentier.den-kit
productName: den-kit
executableName: den-kit
artifactName: den-kit-${version}-${arch}.${ext}
directories:
  app: .desktop-build/app
  output: release
files:
  - '**/*'
  - '!**/*.map'
  # Main/preload and the renderer are fully bundled. No repository dependencies belong in app.asar.
  - '!node_modules/**/*'
extraResources:
  - from: .desktop-build/resources
    to: .
  # scripts/build-desktop.ts stages the native Codex CLI for each architecture.
  - from: .desktop-build/codex/${arch}
    to: codex
asar: true
npmRebuild: false
mac:
  icon: build/icon.icns
  # dmg installs the app; zip and latest-mac.yml are what the in-app updater downloads.
  target:
    - target: dmg
      arch: [arm64, x64]
    - target: zip
      arch: [arm64, x64]
  category: public.app-category.music
  # Signing uses a Developer ID Application identity from CSC_LINK or the keychain, and notarization
  # runs when Apple credentials are present in the environment (see RELEASE.md).
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    CFBundleName: den-kit
    CFBundleDisplayName: den-kit
    NSMicrophoneUsageDescription: den-kit uses your microphone or audio interface for audio input when you choose it.
    NSAudioCaptureUsageDescription: den-kit uses audio input when you choose it.
dmg:
  writeUpdateInfo: false
publish:
  provider: github
  owner: yuichkun
  repo: den-kit
  releaseType: draft
